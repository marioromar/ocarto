name: Ocarto LiDAR smoke tests

on:
  push:
    branches:
      - 'ocarto-v258'
      - 'ocarto-v260'
      - 'ocarto-v261'
      - 'ocarto-v262'
  workflow_dispatch:

jobs:
  lidar-worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker and tile planner syntax
        run: |
          node --check source/v234/lidar-worker.js
          node --check source/v234/lidar-tile-plan.js
      - name: Test real LAS / LAZ decoder
        run: node --test source/v234/tests/lidar-worker.test.cjs source/v234/tests/lidar-reader-integration.test.cjs source/v234/tests/lidar-tiling.test.cjs
      - name: Verify offline LAZ dependencies
        run: |
          test -s source/v234/vendor/laz-perf.js
          test -s source/v234/vendor/laz-perf.wasm
          test -s source/v234/vendor/LAZ-PERF-LICENSE.txt

  windows-launch-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Launch Ocarto local server in Windows
        shell: powershell
        run: ./source/v234/tests/test-lidar-launcher.ps1
