name: Ocarto LiDAR smoke tests

on:
  push:
    branches:
      - 'ocarto-v258'
      - 'ocarto-v260'
      - 'ocarto-v261'
      - 'ocarto-v262'
      - 'ocarto-v263'
      - 'ocarto-v264'
      - 'ocarto-v275'
      - 'ocarto-v279-vegetation-height-vector'
      - 'ocarto-v281-auto-vector-elements'
      - 'ocarto-v282-natural-bezier'
      - 'ocarto-v283-scalable-natural-curves'
      - 'ocarto-v284-bezier-geojson-fix'
      - 'ocarto-v285-vegetacion-capas-seleccionadas'
      - 'ocarto-v286-cultivos-candidatos-revisables'
  workflow_dispatch:

jobs:
  lidar-worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker and tile planner syntax
        run: |
          node --check source/v234/lidar-worker.js
          node --check source/v234/lidar-tile-plan.js
          node --check source/v234/lidar-tile-export.js
          node --check source/v234/lidar-mosaic-export.js
          node --check source/v234/lidar-mosaic-contours.js
          node --check source/v234/lidar-source-index.js
          node --check source/v234/lidar-tile-seams.js
          node --check source/v234/lidar-mdt-audit.js
          node --check source/v234/lidar-height-image-vector.js
          node --check source/v234/lidar-vegetation-reviewed-layers.js
          node --check source/v234/lidar-cultivated-candidates.js
          node --check source/v234/lidar-transport-water.js
          node --check source/v234/lidar-ortho-fusion.js
          node --check source/v234/lidar-auto-natural-bezier.js
      - name: Test real LAS / LAZ decoder
        run: node --test source/v234/tests/lidar-worker.test.cjs source/v234/tests/lidar-reader-integration.test.cjs source/v234/tests/lidar-tiling.test.cjs source/v234/tests/lidar-export.test.cjs source/v234/tests/lidar-source-index.test.cjs source/v234/tests/lidar-seams.test.cjs source/v234/tests/lidar-mdt-audit.test.cjs
      - name: Unified LiDAR mosaic across two or many LAZ, VRT and CSV
        run: node --test source/v234/tests/lidar-mosaic-export.test.cjs
      - name: LiDAR mosaic contours across LAZ file and grid boundaries
        run: node --test source/v234/tests/lidar-mosaic-contours.test.cjs
      - name: LAS/LAZ reader fallback and truncation tests
        run: node --test source/v234/tests/lidar-stream-fallback.test.cjs
      - name: Vectorize PNG vegetation height raster tests
        run: node --test source/v234/tests/lidar-height-image-vector.test.cjs
      - name: Validate selective vegetation GeoJSON layers
        run: node --test source/v234/tests/lidar-vegetation-reviewed-layers.test.cjs
      - name: Yellow and cultivated candidate polygons from learned map examples
        run: node --test source/v234/tests/lidar-cultivated-candidates.test.cjs
      - name: Vector roads and water + LiDAR/orthophoto regression tests
        run: node --test source/v234/tests/lidar-transport-water.test.cjs
      - name: Validate editable natural curves and protected topology
        run: node --test source/v234/tests/lidar-auto-natural-bezier.test.cjs
      - name: Verify curved GeoJSON export and UTM metadata
        run: node --test source/v234/tests/lidar-curved-geojson.test.cjs
      - name: Verify offline LAZ dependencies
        run: |
          test -s source/v234/vendor/laz-perf.js
          test -s source/v234/vendor/laz-perf.wasm
          test -s source/v234/vendor/LAZ-PERF-LICENSE.txt

  windows-launch-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Launch Ocarto local server in Windows
        shell: powershell
        run: ./source/v234/tests/test-lidar-launcher.ps1
