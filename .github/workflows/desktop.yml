name: Ocarto Desktop

on:
  workflow_dispatch:
  push:
    branches: [fix/symbols-v275, ocarto-v285-vegetacion-capas-seleccionadas, ocarto-v287-curvas-alturas-feature-capas]
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'source/v234/**'
      - 'servidor-ocarto.ps1'
      - '.github/workflows/desktop.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist -- --publish never
      - name: Verify Ocarto editor, offline LAZ, and local server in unpacked Windows build
        shell: pwsh
        run: |
          $folders = Get-ChildItem dist -Directory | Where-Object { $_.Name -like '*unpacked*' }
          if (!$folders) { throw 'No Windows unpacked build found to verify resources' }
          $valid = $false
          foreach ($folder in $folders) {
            $base = Join-Path $folder.FullName 'resources'
            $needed = @(
              'index.html',
              'source/v234/index.html',
              'source/v234/lidar-worker.js',
              'source/v234/vendor/laz-perf.wasm',
              'servidor-ocarto.ps1'
            )
            $missing = @($needed | Where-Object { -not (Test-Path (Join-Path $base $_)) })
            if ($missing.Count -eq 0) {
              Write-Host "PASS: Ocarto Windows v287 includes editor, LAS/LAZ and local server"
              $valid = $true
              break
            }
            Write-Host ("Incomplete package in " + $base + ": " + ($missing -join ', '))
          }
          if (!$valid) { throw 'Windows package is missing required offline LiDAR resources' }
      - uses: actions/upload-artifact@v4
        with:
          name: Ocarto-Desktop-Windows
          path: |
            dist/*.exe
          retention-days: 30
